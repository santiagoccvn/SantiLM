name: Reply to Issue Comments

on:
  issue_comment:
    types: [created]

jobs:
  reply:
    runs-on: ubuntu-latest
    # Only reply to comments on issues (not pull requests)
    if: github.event.issue.pull_request == null
    permissions:
      issues: write

    steps:
      - name: Post reply to issue comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const commenter = context.payload.comment.user.login;
            const issueNumber = context.payload.issue.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `Thanks for your comment, @${commenter}! 👋 We have received your message and will get back to you as soon as possible.`
            });
